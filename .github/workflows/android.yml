name: Android native debug build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: C++ and Kotlin JNI regression
        run: bash scripts/test_host.sh
      - name: P4567 versus P8910 same-runner comparison
        run: bash scripts/compare_tracker.sh
      - name: P8910 exact output and CPU regression gate
        run: bash scripts/pony_compare.sh
  build:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Android SDK dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Download pinned offline pose model
        run: bash scripts/fetch_pose_model.sh
      - name: Build and verify debug APK with offline model
        run: |
          set -o pipefail
          export POSE_MODEL_SHA256=59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a
          bash scripts/build_apk.sh | tee apk-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-strength-native-pony-p8910-debug-unvalidated
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-verification.txt
          if-no-files-found: error
